name: Bundle release assets

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to bundle
        required: true
        default: test

permissions:
  contents: write

jobs:
  bundle:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      BUNDLE_NAME: all-assets.zip
    steps:
      - name: Select release tag
        id: release
        shell: bash
        run: echo "tag=${{ github.event.release.tag_name || inputs.tag }}" >> "$GITHUB_OUTPUT"

      - name: Download release assets
        shell: bash
        run: |
          mkdir release-assets
          gh release download "${{ steps.release.outputs.tag }}" \
            --repo "${{ github.repository }}" \
            --dir release-assets
          rm -f "release-assets/$BUNDLE_NAME"

      - name: Create bundle
        shell: bash
        run: |
          cd release-assets
          zip -r "../$BUNDLE_NAME" .

      - name: Upload bundle to release
        shell: bash
        run: |
          gh release upload "${{ steps.release.outputs.tag }}" "$BUNDLE_NAME" \
            --repo "${{ github.repository }}" \
            --clobber
